<h2 class="sr-only">Diagrama de classes UML do sistema de transporte por aplicativo, com zoom e navegação estilo mapa</h2>
<style>
#map-viewport { position: relative; width: 100%; height: 560px; overflow: hidden; border: 0.5px solid var(--border); border-radius: var(--radius); background: var(--surface-1); cursor: grab; touch-action: none; }
#map-viewport.grabbing { cursor: grabbing; }
#map-inner { transform-origin: 0 0; will-change: transform; }
#map-controls { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 4px; z-index: 2; }
#map-controls button { width: 32px; height: 32px; border-radius: 8px; border: 0.5px solid var(--border-strong); background: var(--surface-2); color: var(--text-primary); font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
#map-controls button:hover { background: var(--surface-1); }
#zoom-pct { position: absolute; bottom: 10px; right: 12px; font-size: 12px; color: var(--text-muted); background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 6px; padding: 2px 8px; z-index: 2; }
#erd svg.classDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.classDiagram .row-rect-odd path,
#erd svg.classDiagram .row-rect-odd rect,
#erd svg.classDiagram .row-rect-even path,
#erd svg.classDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="map-viewport">
  <div id="map-inner"><div id="erd"></div></div>
  <div id="map-controls">
    <button id="zoom-in" aria-label="Aumentar zoom"><i class="ti ti-plus" aria-hidden="true"></i></button>
    <button id="zoom-out" aria-label="Diminuir zoom"><i class="ti ti-minus" aria-hidden="true"></i></button>
    <button id="zoom-reset" aria-label="Restaurar zoom"><i class="ti ti-focus-2" aria-hidden="true"></i></button>
  </div>
  <div id="zoom-pct">100%</div>
</div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `classDiagram
direction TB

class Pessoa {
  <<abstract>>
  -nome String
  -cpf String
  -telefone String
  +getNome() String
  +getCpf() String
}

class Passageiro {
  -corridasSolicitadas List~Corrida~
  +solicitarCorrida(gerenciador, dados) Corrida
}

class Motorista {
  -cnh String
  -disponivel boolean
  -avaliacoes List~Avaliacao~
  +ficarDisponivel() void
  +ficarIndisponivel() void
  +calcularMediaAvaliacoes() double
}

Pessoa <|-- Passageiro
Pessoa <|-- Motorista

class Veiculo {
  <<abstract>>
  -placa String
  -modelo String
  +calcularTarifa(distancia) double
  +getNivelCategoriaMaximo() int
}

class Carro { +calcularTarifa(distancia) double }
class Moto { +calcularTarifa(distancia) double }
class Van { +calcularTarifa(distancia) double }

Veiculo <|-- Carro
Veiculo <|-- Moto
Veiculo <|-- Van

class FormaPagamento {
  <<interface>>
  +aplicar(valor) double
}
class Pix { +aplicar(valor) double }
class Cartao { +aplicar(valor) double }
class Dinheiro { +aplicar(valor) double }

FormaPagamento <|.. Pix
FormaPagamento <|.. Cartao
FormaPagamento <|.. Dinheiro

class CategoriaCorrida {
  <<interface>>
  +aplicarAcrescimo(valor) double
  +isCompativel(veiculo) boolean
}
class Economica { +aplicarAcrescimo(valor) double }
class Conforto { +aplicarAcrescimo(valor) double }
class Premium { +aplicarAcrescimo(valor) double }

CategoriaCorrida <|.. Economica
CategoriaCorrida <|.. Conforto
CategoriaCorrida <|.. Premium

class EstadoCorrida {
  <<enumeration>>
  SOLICITADA
  ACEITA
  EM_ANDAMENTO
  FINALIZADA
  CANCELADA
}

class Avaliacao {
  -nota int
  -comentario String
}

class Corrida {
  -id int
  -origem String
  -destino String
  -distancia double
  -estado EstadoCorrida
  -valor double
  -valorFinal double
  +aceitar(motorista) void
  +iniciar() void
  +finalizar() void
  +cancelar() void
  +calcularValor() double
  +avaliar(nota, comentario) void
  +podeSerAceitaPor(motorista) boolean
}

class GerenciadorCorridas {
  -corridas List~Corrida~
  +solicitarCorrida(...) Corrida
  +listarPorEstado(estado) List~Corrida~
}

class SistemaTransporte {
  -passageiros List~Passageiro~
  -motoristas List~Motorista~
  -veiculos List~Veiculo~
  -gerenciadorCorridas GerenciadorCorridas
  +cadastrarPassageiro(passageiro) void
  +cadastrarMotorista(motorista) void
  +cadastrarVeiculo(veiculo) void
  +solicitarCorrida(...) Corrida
  +buscarCorridaPorId(id) Corrida
}

class MenuConsole {
  -sistema SistemaTransporte
  +executar() void
}

Passageiro "1" --> "*" Corrida : solicita
Motorista "1" --> "*" Corrida : realiza
Motorista "1" *-- "1" Veiculo : possui
Corrida "1" --> "0..1" Veiculo : utiliza
Corrida "1" --> "1" FormaPagamento : usa
Corrida "1" --> "1" CategoriaCorrida : usa
Corrida "1" --> "1" EstadoCorrida : possui
Corrida "1" *-- "0..1" Avaliacao : recebe
GerenciadorCorridas "1" o-- "*" Corrida : gerencia
SistemaTransporte "1" *-- "1" GerenciadorCorridas
SistemaTransporte "1" o-- "*" Passageiro : cadastra
SistemaTransporte "1" o-- "*" Motorista : cadastra
SistemaTransporte "1" o-- "*" Veiculo : cadastra
MenuConsole --> SistemaTransporte : opera
`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.classDiagram .node, #erd svg.classDiagram g[class*="classGroup"]').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '4');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.classDiagram .row-rect-odd path, #erd svg.classDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});

initPanZoom();
</script>
<script>
function initPanZoom() {
  const viewport = document.getElementById('map-viewport');
  const inner = document.getElementById('map-inner');
  const pctLabel = document.getElementById('zoom-pct');
  let scale = 1, tx = 0, ty = 0;
  let dragging = false, lastX = 0, lastY = 0;
  const minScale = 0.25, maxScale = 4;

  function fitToViewport() {
    const svgEl = inner.querySelector('svg');
    if (!svgEl) return;
    const bbox = svgEl.getBoundingClientRect();
    const vpRect = viewport.getBoundingClientRect();
    if (bbox.width === 0 || bbox.height === 0) return;
    const naturalScale = 1;
    const fit = Math.min((vpRect.width - 40) / (bbox.width / naturalScale), (vpRect.height - 40) / (bbox.height / naturalScale), 1);
    scale = fit;
    tx = (vpRect.width - bbox.width * scale) / 2;
    ty = 20;
    apply();
  }

  function apply() {
    scale = Math.min(maxScale, Math.max(minScale, scale));
    inner.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    pctLabel.textContent = Math.round(scale * 100) + '%';
  }

  function zoomAt(factor, clientX, clientY) {
    const rect = viewport.getBoundingClientRect();
    const px = clientX - rect.left, py = clientY - rect.top;
    const before = scale;
    scale = Math.min(maxScale, Math.max(minScale, scale * factor));
    const ratio = scale / before;
    tx = px - (px - tx) * ratio;
    ty = py - (py - ty) * ratio;
    apply();
  }

  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    zoomAt(factor, e.clientX, e.clientY);
  }, { passive: false });

  viewport.addEventListener('mousedown', (e) => {
    dragging = true;
    viewport.classList.add('grabbing');
    lastX = e.clientX; lastY = e.clientY;
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    tx += e.clientX - lastX;
    ty += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    apply();
  });
  window.addEventListener('mouseup', () => {
    dragging = false;
    viewport.classList.remove('grabbing');
  });

  let lastTouchDist = null, lastTouchMid = null;
  function touchDist(t) { return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY); }
  function touchMid(t) { return { x: (t[0].clientX + t[1].clientX) / 2, y: (t[0].clientY + t[1].clientY) / 2 }; }

  viewport.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      dragging = true;
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      dragging = false;
      lastTouchDist = touchDist(e.touches);
      lastTouchMid = touchMid(e.touches);
    }
  }, { passive: true });

  viewport.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && dragging) {
      tx += e.touches[0].clientX - lastX;
      ty += e.touches[0].clientY - lastY;
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
      apply();
    } else if (e.touches.length === 2) {
      const d = touchDist(e.touches);
      const mid = touchMid(e.touches);
      if (lastTouchDist) {
        const factor = d / lastTouchDist;
        zoomAt(factor, mid.x, mid.y);
      }
      lastTouchDist = d; lastTouchMid = mid;
    }
    e.preventDefault();
  }, { passive: false });

  viewport.addEventListener('touchend', (e) => {
    if (e.touches.length === 0) { dragging = false; lastTouchDist = null; }
  });

  document.getElementById('zoom-in').addEventListener('click', () => {
    const rect = viewport.getBoundingClientRect();
    zoomAt(1.25, rect.left + rect.width / 2, rect.top + rect.height / 2);
  });
  document.getElementById('zoom-out').addEventListener('click', () => {
    const rect = viewport.getBoundingClientRect();
    zoomAt(1 / 1.25, rect.left + rect.width / 2, rect.top + rect.height / 2);
  });
  document.getElementById('zoom-reset').addEventListener('click', fitToViewport);

  setTimeout(fitToViewport, 60);
}
</script>
